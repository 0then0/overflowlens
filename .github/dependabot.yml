version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: '10:00'
      timezone: Europe/Moscow
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      npm-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore

  - package-ecosystem: gomod
    directory: /validation
    schedule:
      interval: monthly
      time: '10:00'
      timezone: Europe/Moscow
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      validation-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '10:00'
      timezone: Europe/Moscow
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore
