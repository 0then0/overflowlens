name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Verify release version and notes
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p = JSON.parse(fs.readFileSync('package.json')); if (process.env.GITHUB_REF_NAME !== 'v' + p.version) throw new Error('Tag must match package.json version');"
          test -f "docs/releases/$GITHUB_REF_NAME.md"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Package static application
        run: npm run package:release -- --repository "$GITHUB_REPOSITORY"
      - name: Upload and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          archive="overflowlens-${GITHUB_REF_NAME#v}.zip"
          gh release create "$GITHUB_REF_NAME" "release/$archive" release/SHA256SUMS.txt \
            --verify-tag --draft --title "OverflowLens $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
