name: Deploy Pages

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Reviewed full 40-character commit SHA (initial distribution: descendant of v0.2.1)'
        required: true
        type: string
      version:
        description: 'Published stable application version, without v'
        required: true
        default: '0.2.1'
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Validate explicit source inputs
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          APP_VERSION: ${{ inputs.version }}
        run: |
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify published version and source ancestry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
          APP_VERSION: ${{ inputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          test -f tests/browser/pages.spec.ts
          release_tag="v$APP_VERSION"
          published_tag=$(gh api "repos/$GH_REPO/releases/tags/$release_tag" --jq 'select(.draft == false and .prerelease == false) | .tag_name')
          test "$published_tag" = "$release_tag"
          release_commit=$(git rev-parse "$release_tag^{commit}")
          git merge-base --is-ancestor "$release_commit" HEAD
          # Distribution changes may add examples/UI/docs, but cannot silently change the released core or dependencies.
          git diff --exit-code "$release_commit" HEAD -- src/core src/import.worker.ts package.json package-lock.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json'));
          if ([pkg.version, lock.version, lock.packages[''].version].some(v => v !== process.env.APP_VERSION))
            throw new Error('Source and lockfile must match the published application version');
          JS
          printf 'Version: %s\nSource commit: %s\nPublished release commit: %s\n' "$APP_VERSION" "$SOURCE_REF" "$release_commit" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Record deployment source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          APP_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          fs.writeFileSync('dist/deployment.json', JSON.stringify({
            applicationVersion: process.env.APP_VERSION,
            sourceCommit: process.env.SOURCE_REF,
            publishedRelease: `v${process.env.APP_VERSION}`
          }, null, 2) + '\n');
          JS
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
